[project]
name = "smart-village-backend"
version = "1.0.0"
description = "Smart Village AI Platform - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "transformers>=4.44.0",
    "torch>=2.4.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",
    "loguru>=0.7.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "boto3>=1.35.0",
    "geopy>=2.4.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
